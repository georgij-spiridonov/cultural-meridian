[project]
name = "cultural-meridian"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "mypy==2.4.1",
    "ruff==0.17.5",
    "pip-audit==2.10.1",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
ignore = ["RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []
select = [
    # Базовые правила
    "E",
    "W",
    "F",
    "I",
    "B",
    "D",
    "UP",
    "SIM",

    # Семейство RUF целиком
    "RUF",

    # Архитектурные правила
    "TID",
    "PTH",
    "T20",
    "ASYNC",
    "C4",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true
