services:
  database:
    image: postgres:17-alpine
    container_name: cultural-meridian-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cultural_meridian}
      POSTGRES_USER: ${DATABASE_USER:-cultural_meridian}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cultural_meridian_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
      TZ: Asia/Yekaterinburg
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cultural_meridian} -d ${DATABASE_NAME:-cultural_meridian}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultural-meridian-migrator
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      TZ: Asia/Yekaterinburg
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run python -m src.entrypoints.command_line.seed
    healthcheck:
      disable: true

  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultural-meridian-web-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8000"
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://localhost:8000}
      TZ: Asia/Yekaterinburg
    ports:
      - "${WEB_PORT:-8000}:8000"
    command:
      - uv
      - run
      - uvicorn
      - src.entrypoints.web.application:create_default_application
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultural-meridian-telegram-bot
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      TZ: Asia/Yekaterinburg
    command:
      - uv
      - run
      - python
      - -m
      - src.entrypoints.telegram_bot.runner
    healthcheck:
      disable: true

  background_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultural-meridian-background-worker
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      TZ: Asia/Yekaterinburg
    command:
      - uv
      - run
      - python
      - -m
      - src.entrypoints.background_worker.runner
    healthcheck:
      disable: true

volumes:
  postgres_data:
