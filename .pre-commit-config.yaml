#file: noinspection YAMLSchemaValidation
default_install_hook_types:
  - pre-commit
  - pre-merge-commit
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Базовая гигиена стиля и синтаксиса
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Поиск секретов
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      # Проверка форматирования
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml|ruff\.toml)
        stages: [pre-commit, pre-merge-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml|ruff\.toml)
        stages: [pre-commit, pre-merge-commit]

      # Типизация
      - id: mypy
        name: mypy type check
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, pre-push]

      # Проверка синхронизации uv.lock с pyproject.toml
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Аудит уязвимостей в зависимостях
      - id: pip-audit
        name: pip audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
