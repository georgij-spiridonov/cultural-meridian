# Декларативный реестр источников культурной афиши Республики Башкортостан.
# Активные локальные фиды обеспечивают воспроизводимый офлайн-сбор без внешней сети,
# а отключённые шаблоны документируют подключение реальных региональных порталов.

sources:
  - name: ufa_culture_rss
    source_type: rss
    source_url: data/local_feeds/ufa_afisha.rss.xml
    default_city: Уфа
    default_category: null
    is_enabled: true
    request_timeout_seconds: 5.0

  - name: sterlitamak_afisha_api
    source_type: api
    source_url: data/local_feeds/sterlitamak_events.json
    default_city: Стерлитамак
    default_category: null
    is_enabled: true
    request_timeout_seconds: 5.0

  - name: salavat_theaters_html
    source_type: webpage
    source_url: data/local_feeds/salavat_afisha.html
    default_city: Салават
    default_category: spectacle
    is_enabled: true
    request_timeout_seconds: 5.0

  - name: neftekamsk_philharmonic_api
    source_type: api
    source_url: data/local_feeds/neftekamsk_events.json
    default_city: Нефтекамск
    default_category: concert
    is_enabled: true
    request_timeout_seconds: 5.0

  # Отключённые шаблоны реальных внешних источников Республики Башкортостан и РФ.
  - name: culture_rf_bashkortostan_api
    source_type: api
    source_url: https://www.culture.ru/api/v1/events?region=bashkortostan
    default_city: null
    default_category: null
    is_enabled: false
    request_timeout_seconds: 8.0

  - name: minkult_rb_rss
    source_type: rss
    source_url: https://culture.bashkortostan.ru/presscenter/news/rss/
    default_city: Уфа
    default_category: null
    is_enabled: false
    request_timeout_seconds: 6.0

  # Реальные сайты учреждений культуры с именными парсерами разметки.
  # default_venue — площадка в том виде, как она названа в configuration/venues_coordinates.yaml;
  # она подставляется только для мероприятий в городе источника, гастроли уходят в модерацию.

  # Ссылки /afisha/ и /robots.txt перенаправляют на главную; блок «Афиша» находится на главной странице.
  - name: bashopera-ufa
    source_type: webpage
    source_url: https://bashopera.ru/
    default_city: Уфа
    default_category: spectacle
    default_venue: Башкирский государственный театр оперы и балета
    is_enabled: true
    request_timeout_seconds: 10.0
    parser:
      name: bashopera

  - name: bashgf-ufa
    source_type: webpage
    source_url: https://bashgf.ru/afisha/
    default_city: Уфа
    default_category: concert
    default_venue: Башкирская государственная филармония имени Хусаина Ахметова
    is_enabled: true
    request_timeout_seconds: 10.0
    parser:
      name: wordpress_events

  - name: sgtko-sterlitamak
    source_type: webpage
    source_url: https://sgtko.ru/afisha/
    default_city: Стерлитамак
    default_venue: Стерлитамакское государственное театрально-концертное объединение
    is_enabled: true
    request_timeout_seconds: 10.0
    parser:
      name: wordpress_events

  # Город по умолчанию не задан намеренно: сеансы с «Разными адресами проведения», для которых
  # город не удалось уточнить по странице сеанса, должны уйти в модерацию, а не получить Салават.
  - name: quicktickets-salavat
    source_type: webpage
    source_url: https://quicktickets.ru/salavat/afisha
    default_category: spectacle
    default_venue: Салаватский государственный башкирский драматический театр
    is_enabled: true
    request_timeout_seconds: 10.0
    parser:
      name: quicktickets
      options:
        city: Салават

  - name: rusdramteatr-sterlitamak
    source_type: webpage
    source_url: https://rusdramteatr.ru/afisha
    default_city: Стерлитамак
    default_category: spectacle
    default_venue: Стерлитамакский государственный русский драматический театр
    is_enabled: true
    request_timeout_seconds: 10.0
    parser:
      name: rusdramteatr
